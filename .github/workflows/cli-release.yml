name: cli-release

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (must match packages/cli src/version.ts + package.json)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/cli-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cli-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "No version resolved (tag cli-v* or workflow_dispatch input.version required)" >&2
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Version '${VERSION}' is not a valid semver" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building CLI version ${VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        working-directory: packages/cli
        run: node --experimental-strip-types scripts/build.ts --version "${{ steps.version.outputs.version }}"

      - name: Generate install.sh
        working-directory: packages/cli
        shell: bash
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -e "s|@REPO@|${REPO}|g" -e "s|@VERSION@|${VERSION}|g" \
            scripts/install.sh > dist/install.sh
          chmod +x dist/install.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: cli-v${{ steps.version.outputs.version }}
          TITLE: platform CLI v${{ steps.version.outputs.version }}
        working-directory: packages/cli/dist
        shell: bash
        run: |
          cat > notes.md <<EOF
          Standalone \`platform\` CLI (manifest-driven variant).

          ## Install
          \`\`\`sh
          curl -fsSL https://github.com/${REPO}/releases/download/${TAG}/install.sh | sh
          \`\`\`

          Binaries: linux-x64, darwin-arm64, darwin-x64 (with .sha256 checksums).
          EOF

          FILES="platform-linux-x64 platform-darwin-arm64 platform-darwin-x64 \
            platform-linux-x64.sha256 platform-darwin-arm64.sha256 platform-darwin-x64.sha256 install.sh"

          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" ${FILES} --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file notes.md
          else
            gh release create "${TAG}" ${FILES} --title "${TITLE}" --notes-file notes.md
          fi
