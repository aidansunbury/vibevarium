# Vibevarium auth + control plane stack.
# DOMAIN is substituted by deploy.sh (envsubst / sed) — nothing hardcodes it.
# DB credentials are injected at deploy time via .env (see deploy.sh).
version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - casdoor
      - control-plane
    networks:
      - vibevarium

  # Casdoor auth server (replaces Logto). Chosen for RFC 7591 DCR + RFC 7592
  # registration management + CIMD — per-app OIDC clients are created with one
  # DCR call instead of a Logto M2M Management-API adapter. See
  # docs/redeployment-plan.md §1.
  casdoor:
    image: casbin/casdoor:latest
    restart: unless-stopped
    environment:
      RUNNING_IN_DOCKER: "true"
      runmode: prod
      # XORM requires the `casdoor` database to pre-exist — the deploy script
      # creates it on RDS alongside `control_plane` (idempotent CREATE DATABASE).
      driverName: postgres
      # For Postgres the db name appears in BOTH dbName and the DSN's dbname.
      dataSourceName: user=${DB_USER} password=${DB_PASSWORD} host=${DB_HOST} port=${DB_PORT} sslmode=require dbname=casdoor
      dbName: casdoor
      # Public origin (drives the OIDC issuer + discovery URLs).
      origin: https://auth.${DOMAIN}
      # Headless admin bootstrap: sets built-in/admin password on first run so
      # no one has to visit the welcome page on an internet-facing server. The
      # value is injected from AWS Secrets Manager at deploy time.
      initAdminPassword: ${CASDOOR_ADMIN_PASSWORD}
    networks:
      - vibevarium

  control-plane:
    build:
      context: ./control-plane
      dockerfile: packages/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4100"
      HOST: "0.0.0.0"
      # Real Postgres on RDS. DATABASE_URL (incl. the password) is injected at
      # boot from AWS Secrets Manager /vibevarium/prod/DATABASE_URL — see
      # SECRETS_PROVIDER=aws below + packages/control-plane/DB-SPIKE.md.
      # (DATABASE_URL is NOT set here; boot.ts fetches it into process.env.)
      DISCOVERY_INTERVAL_MS: "30000"
      # Casdoor issuer. Casdoor is a complete OIDC provider; the issuer is the
      # origin root (discovery at auth.<domain>/.well-known/openid-configuration).
      TERRARIUM_AUTH_PROVIDER: casdoor
      TERRARIUM_ISSUER: https://auth.${DOMAIN}
      # API origin (the OIDC callback + all API routes). The GUI SPA is served
      # from Cloudflare at platform.<domain>; the session cookie is scoped
      # .vibevarium.com so it's sent same-site across the two subdomains.
      CONTROL_PLANE_BASE_URL: https://api.${DOMAIN}
      GUI_ORIGIN: https://platform.${DOMAIN}
      COOKIE_DOMAIN: .${DOMAIN}
      PLATFORM_OIDC_AUDIENCE: https://mcp.${DOMAIN}
      TERRARIUM_CONNECTION_PROVIDERS: github,linear
      # GUI_DIR no longer served from the container (the SPA is on Cloudflare);
      # unset → the guiRoutes static-serving is disabled.
      # GUI_DIR: /app/packages/control-plane/web/dist
      # Scaffold in real cloudflare mode: GitHub App + Cloudflare account.
      # Secrets (github key, cf token) resolve from AWS Secrets Manager.
      GIT_PROVIDER: github
      GITHUB_APP_INSTALLATION_ID: "184285119"
      GITHUB_ORG: terrarium-sandbox
      CLOUDFLARE_ACCOUNT_ID: 7bbaa8f97d6ababf1a5e29eb79491ce3
      CLOUDFLARE_WORKERS_SUBDOMAIN: modal-opencode-test
      CLOUDFLARE_ZONE_ID: c6ae3b555628f3c6c0fb3883c479dcc4
      ROUTER_KV_NAMESPACE_ID: 7953882922294f5b84298ba7d8794fe4
      ALCHEMY_HOME: /data/alchemy-home
      TERRARIUM_DOMAIN: ${DOMAIN}
      # Secrets come from AWS Secrets Manager via the EC2 instance profile —
      # no secret env vars here. Key NAMES are mapped in src/secrets/boot.ts.
      SECRETS_PROVIDER: aws
      AWS_REGION: us-east-1
      SECRETS_PREFIX: /vibevarium/prod/
    volumes:
      - alchemy_home:/data
    # The PGlite volume is gone: state now lives in RDS. The old
    # control_plane_data volume is kept declared below for one manual backup
    # of the pre-RDS PGlite dir (docker run --rm -v … tar); it is no longer
    # mounted anywhere and can be dropped with `docker volume rm`.
    networks:
      - vibevarium

networks:
  vibevarium:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  # Alchemy home (app deploy profiles/state) persists across container restarts.
  alchemy_home:
  # Unmounted legacy PGlite volume from the pre-RDS stack — kept only so one
  # manual backup can still be taken; safe to `docker volume rm` afterwards.
  control_plane_data:
