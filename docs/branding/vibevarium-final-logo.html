<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vibevarium · the mark</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,480;0,9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, serif; background: #f7f7f1; color: #1e3120; padding: 3rem 1.5rem 4rem; display: flex; flex-direction: column; align-items: center; gap: 2.5rem; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 480; font-size: 1.6rem; margin: 0; }
  h1 .orn { color: #8c541f; }
  .sub { font-family: "IBM Plex Mono", monospace; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; opacity: .55; margin-top: -1.8rem; }
  .hero { text-align: center; }
  .hero svg { width: 190px; height: auto; }
  .lockup { display: flex; align-items: center; gap: .8rem; font-family: "Fraunces", Georgia, serif; font-size: 2rem; font-weight: 480; }
  .lockup svg { width: 44px; height: auto; }
  .row { display: flex; gap: 1.25rem; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
  .tile { border: 1px solid #1e312030; background: #fcfcf8; padding: 1rem; text-align: center; }
  .tile.dark { background: #1c1e21; border-color: #e8ece730; }
  .tile.dark .ink { color: #e8ece7; }
  .tile .lbl { font-family: "IBM Plex Mono", monospace; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; opacity: .55; margin-top: .5rem; }
  .tile.dark .lbl { opacity: .7; }
  .rule { width: 160px; border-top: 3px double #1e312055; }
  .dark .rule { border-color: #e8ece755; }
  .dl { font-family: "IBM Plex Mono", monospace; font-size: .72rem; opacity: .6; }
  .dl a { color: inherit; }
</style>
</head>
<body>

<h1><span class="orn">❦&thinsp;</span>the mark<span class="orn">&thinsp;❦</span></h1>
<div class="sub">vibevarium · final logo · fig. 1</div>

<div class="hero" id="hero"></div>
<div class="rule"></div>
<div class="lockup" id="lockup">vibevarium</div>

<div class="row">
  <div class="tile"><span class="ink" data-size="96"></span><div class="lbl">96 · light</div></div>
  <div class="tile dark"><span class="ink" data-size="96"></span><div class="lbl">96 · dark</div></div>
  <div class="tile"><span class="ink" data-size="48"></span><div class="lbl">48</div></div>
  <div class="tile"><span class="ink" data-size="32"></span><div class="lbl">32 · header</div></div>
  <div class="tile"><span class="ink" data-size="24"></span><div class="lbl">24</div></div>
  <div class="tile"><span class="ink" data-size="16"></span><div class="lbl">16 · favicon</div></div>
</div>

<div class="dl">source: <a href="./logo.svg">docs/branding/logo.svg</a> · component: <code>@terrarium/ui/components/logo</code></div>

<script>
const MARK = (size, ink = "currentColor", glass = null, bracket = "#c88439") => `
<svg width="${size}" height="${size * 138 / 120}" viewBox="0 0 120 138" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="30" y="6" width="60" height="13" rx="4" fill="${ink}"/>
  <path d="M36 19v8c-7 7-13 11-13 25v45c0 13 9 21 26 21h22c17 0 26-8 26-21V52c0-14-6-18-13-25v-8"
        stroke="${ink}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 31h14M30 51c-2 4-2 8-2 11" stroke="${glass ?? "#f7f7f1"}" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M53 43l-9 8 9 8M67 43l9 8-9 8" stroke="${bracket}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 66v16" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 82c-10 0-19-6-22-16 10 0 19 6 22 16z" fill="${ink}"/>
  <path d="M60 82c10 0 19-6 22-16-10 0-19 6-22 16z" fill="${ink}"/>
  <path d="M46 98c-6 0-11 3-14 9M38 99l-6-4M40 102l-2 7" stroke="${ink}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 98c6 0 11 3 14 9M82 99l6-4M80 102l2 7" stroke="${ink}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 94v-4" stroke="${ink}" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M50 95c0-8 4-11 10-11s10 3 10 11" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>
  <path d="M50 95h20v7c0 10-4.5 17.5-10 22.5-5.5-5-10-12.5-10-22.5v-7z" fill="${ink}"/>
  <path d="M52 97h16" stroke="${glass ?? "#f7f7f1"}" stroke-width="2.4" stroke-linecap="round"/>
</svg>`;

document.getElementById("hero").innerHTML = MARK(190, "#1e3120", "#f7f7f1");
document.getElementById("lockup").insertAdjacentHTML("afterbegin", MARK(44, "#1e3120", "#f7f7f1"));
for (const el of document.querySelectorAll(".tile .ink")) {
  const dark = el.closest(".tile").classList.contains("dark");
  el.innerHTML = MARK(Number(el.dataset.size), dark ? "#e8ece7" : "#1e3120", dark ? "#1c1e21" : "#f7f7f1", dark ? "#d89a54" : "#c88439");
}
</script>
</body>
</html>
